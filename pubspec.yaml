  # Хэширование (для PIN)
  crypto: ^3.0.3

  # Хранение PIN, seed, токенов
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
